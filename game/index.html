<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteor Rush — a one-prompt game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #070312; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap { position: relative; width: min(96vw, 960px); }
  canvas {
    display: block; width: 100%; height: auto;
    border-radius: 14px;
    box-shadow: 0 0 60px rgba(196, 28, 131, .35), 0 0 24px rgba(0, 229, 255, .25);
  }
  #hint {
    position: absolute; left: 0; right: 0; bottom: -34px; text-align: center;
    color: #8f86b8; font-size: 14px; letter-spacing: .04em;
  }
  #hint b { color: #e8e4ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint">Move with <b>mouse</b> or <b>&larr; &rarr;</b> keys &nbsp;·&nbsp; grab stars, dodge meteors &nbsp;·&nbsp; <b>R</b> restarts</div>
</div>
<script>
"use strict";
/*
 * METEOR RUSH — built from one prompt:
 * "Build a tiny browser game: a neon ship dodges falling meteors,
 *  grabs stars for points, and gets faster and faster.
 *  Mouse or arrow keys. Score and a game over screen."
 */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = 960, H = 540;
const DEMO = new URLSearchParams(location.search).has("demo");

const ship = { x: W / 2, y: H - 78, r: 20, vx: 0, tilt: 0 };
let meteors = [], stars = [], sparks = [], bgStars = [];
let score = 0, best = +(localStorage.getItem("meteor-rush-best") || 0);
let lives = 3, level = 1, elapsed = 0, spawnT = 0, starT = 0;
let state = "play";           // "play" | "over"
let overT = 0, shake = 0, flash = 0;
const keys = {};

// background starfield
for (let i = 0; i < 110; i++) {
  bgStars.push({ x: Math.random() * W, y: Math.random() * H,
                 s: Math.random() * 1.8 + .4, v: Math.random() * 22 + 6,
                 tw: Math.random() * Math.PI * 2 });
}

function rand(a, b) { return a + Math.random() * (b - a); }

function spawnMeteor() {
  const r = rand(14, 34);
  meteors.push({
    x: rand(r, W - r), y: -r - 10, r,
    vy: rand(150, 230) + level * 26,
    vx: rand(-40, 40),
    rot: rand(0, Math.PI * 2), vr: rand(-1.6, 1.6),
    jag: Array.from({ length: 9 }, () => rand(.72, 1.12)),
    hue: rand(8, 32),
  });
}
function spawnStar() {
  stars.push({ x: rand(24, W - 24), y: -20, r: 13,
               vy: rand(120, 170) + level * 12, rot: 0, vr: rand(1.5, 3) });
}
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(speed * .3, speed);
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                  life: rand(.35, .8), max: .8, color, r: rand(2, 4.5) });
  }
}

function reset() {
  meteors = []; stars = []; sparks = [];
  score = 0; lives = 3; level = 1; elapsed = 0;
  ship.x = W / 2; ship.vx = 0; state = "play"; flash = 0;
}
function gameOver() {
  state = "over"; overT = 0;
  if (score > best) { best = score; localStorage.setItem("meteor-rush-best", best); }
  burst(ship.x, ship.y, "#00e5ff", 60, 320);
  burst(ship.x, ship.y, "#ff5a3c", 40, 240);
  shake = 14;
}

// ---- input ----
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect();
  ship.x = (e.clientX - r.left) / r.width * W;
});
addEventListener("keydown", e => {
  keys[e.key] = true;
  if ((e.key === "r" || e.key === "R") && state === "over") reset();
  if (e.key === " " && state === "over") reset();
});
addEventListener("keyup", e => { keys[e.key] = false; });
cv.addEventListener("pointerdown", () => { if (state === "over") reset(); });

// ---- demo autopilot: steers away from the nearest threat, toward stars ----
function autopilot(dt) {
  let threat = null, threatScore = 1e9;
  for (const m of meteors) {
    if (m.y < ship.y && m.y > ship.y - 340) {
      const d = Math.abs(m.x - ship.x) - m.r;
      const s = d + (ship.y - m.y) * .22;
      if (s < threatScore) { threatScore = s; threat = m; }
    }
  }
  let target = ship.x;
  if (threat && threatScore < 210) {
    target = ship.x + (ship.x < threat.x ? -1 : 1) * 230;
  } else {
    let bestStar = null, bd = 1e9;
    for (const s of stars) {
      const d = Math.abs(s.x - ship.x) + (ship.y - s.y) * .2;
      if (d < bd) { bd = d; bestStar = s; }
    }
    if (bestStar) target = bestStar.x;
  }
  target = Math.max(28, Math.min(W - 28, target));
  ship.x += (target - ship.x) * Math.min(1, dt * 7);
}

// ---- update ----
function update(dt) {
  elapsed += dt;
  level = 1 + Math.floor(elapsed / 12);
  const speed = 1 + elapsed / 55;

  for (const s of bgStars) {
    s.y += s.v * dt * speed; s.tw += dt * 3;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
  spawnT -= dt;
  if (state === "play" && spawnT <= 0) { spawnMeteor(); spawnT = rand(.34, .62) / Math.min(speed, 2.2); }
  starT -= dt;
  if (state === "play" && starT <= 0) { spawnStar(); starT = rand(1.1, 2.0); }

  if (state === "play") {
    if (DEMO) autopilot(dt);
    else {
      const k = (keys["ArrowLeft"] || keys["a"] ? -1 : 0) +
                (keys["ArrowRight"] || keys["d"] ? 1 : 0);
      ship.vx = k * 560;
      ship.x += ship.vx * dt;
    }
    ship.x = Math.max(26, Math.min(W - 26, ship.x));
    ship.tilt += ((ship.vx / 560) * .35 - ship.tilt) * Math.min(1, dt * 10);

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.y += m.vy * dt; m.x += m.vx * dt; m.rot += m.vr * dt;
      if (m.y - m.r > H + 20) { meteors.splice(i, 1); continue; }
      const dx = m.x - ship.x, dy = m.y - ship.y;
      if (dx * dx + dy * dy < (m.r + ship.r - 8) * (m.r + ship.r - 8)) {
        meteors.splice(i, 1);
        lives--; flash = .35; shake = 12;
        burst(ship.x, ship.y, "#ff5a3c", 34, 260);
        burst(ship.x, ship.y, "#00e5ff", 20, 200);
        if (lives <= 0) gameOver();
      }
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.vy * dt; s.rot += s.vr * dt;
      if (s.y - s.r > H + 20) { stars.splice(i, 1); continue; }
      const dx = s.x - ship.x, dy = s.y - ship.y;
      if (dx * dx + dy * dy < (s.r + ship.r + 6) * (s.r + ship.r + 6)) {
        stars.splice(i, 1);
        score += 10;
        burst(s.x, s.y, "#ffd23c", 16, 170);
      }
    }
  } else {
    overT += dt;
    // after game over the field keeps drifting so the backdrop stays alive
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.y += m.vy * .45 * dt; m.x += m.vx * .45 * dt; m.rot += m.vr * .45 * dt;
      if (m.y - m.r > H + 20) meteors.splice(i, 1);
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.vy * .45 * dt; s.rot += s.vr * .45 * dt;
      if (s.y - s.r > H + 20) stars.splice(i, 1);
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life -= dt;
    if (p.life <= 0) sparks.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt);
}

// ---- draw ----
function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.tilt);
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 22;
  const g = ctx.createLinearGradient(0, -26, 0, 18);
  g.addColorStop(0, "#aef7ff"); g.addColorStop(.5, "#00e5ff"); g.addColorStop(1, "#c41c83");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(17, 14); ctx.lineTo(7, 8);
  ctx.lineTo(0, 16); ctx.lineTo(-7, 8); ctx.lineTo(-17, 14);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(0, -6, 4.5, 0, Math.PI * 2); ctx.fill();
  // engine flame
  const f = 10 + Math.random() * 10;
  ctx.fillStyle = "rgba(255, 150, 60, .9)";
  ctx.beginPath();
  ctx.moveTo(-6, 15); ctx.lineTo(0, 15 + f + 8); ctx.lineTo(6, 15);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y); ctx.rotate(m.rot);
  ctx.shadowColor = `hsl(${m.hue} 100% 55%)`; ctx.shadowBlur = 16;
  ctx.fillStyle = "#3a1c12";
  ctx.strokeStyle = `hsl(${m.hue} 95% 55%)`; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < m.jag.length; i++) {
    const a = i / m.jag.length * Math.PI * 2, r = m.r * m.jag[i];
    i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255, 120, 60, .5)";
  ctx.beginPath(); ctx.arc(-m.r * .25, -m.r * .3, m.r * .28, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawStar(s) {
  ctx.save();
  ctx.translate(s.x, s.y); ctx.rotate(s.rot);
  ctx.shadowColor = "#ffd23c"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#ffd23c";
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2, r = i % 2 ? s.r * .42 : s.r;
    i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0a0620"); bg.addColorStop(.6, "#12082e"); bg.addColorStop(1, "#1c0a33");
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);

  for (const s of bgStars) {
    ctx.globalAlpha = .35 + .35 * Math.sin(s.tw);
    ctx.fillStyle = "#cfe8ff";
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // nebula blobs
  ctx.globalAlpha = .10;
  ctx.fillStyle = "#c41c83";
  ctx.beginPath(); ctx.arc(180, 120, 150, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#00b3d6";
  ctx.beginPath(); ctx.arc(820, 420, 170, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  for (const s of stars) drawStar(s);
  for (const m of meteors) drawMeteor(m);
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (state === "play") drawShip();

  // HUD
  ctx.textBaseline = "top";
  ctx.fillStyle = "#fff";
  ctx.font = "700 30px 'Segoe UI', system-ui, sans-serif";
  ctx.fillText("SCORE  " + score, 22, 18);
  ctx.font = "600 20px 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#9d94c9";
  ctx.fillText("BEST  " + best, 22, 56);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd23c";
  ctx.font = "700 22px 'Segoe UI', system-ui, sans-serif";
  ctx.fillText("LEVEL " + level, W - 22, 20);
  ctx.textAlign = "left";
  // lives
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? "#ff4d6d" : "rgba(255,77,109,.18)";
    ctx.beginPath();
    const lx = W - 30 - i * 34, ly = 66;
    ctx.moveTo(lx, ly + 5);
    ctx.bezierCurveTo(lx - 9, ly - 4, lx - 16, ly + 4, lx, ly + 13);
    ctx.bezierCurveTo(lx + 16, ly + 4, lx + 9, ly - 4, lx, ly + 5);
    ctx.fill();
  }

  if (state === "over") {
    ctx.fillStyle = "rgba(5, 2, 16, .72)";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff4d6d";
    ctx.font = "800 64px 'Segoe UI', system-ui, sans-serif";
    ctx.shadowColor = "#ff4d6d"; ctx.shadowBlur = 30;
    ctx.fillText("GAME OVER", W / 2, 150);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff";
    ctx.font = "700 34px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("SCORE  " + score, W / 2, 245);
    ctx.fillStyle = score >= best && score > 0 ? "#ffd23c" : "#9d94c9";
    ctx.font = "600 24px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(score >= best && score > 0 ? "NEW BEST!" : "BEST  " + best, W / 2, 295);
    if (overT > .6) {
      ctx.fillStyle = "#e8e4ff";
      ctx.font = "600 22px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("press R or click to play again", W / 2, 350);
    }
    ctx.textAlign = "left";
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 60, 60, ${flash * .55})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
